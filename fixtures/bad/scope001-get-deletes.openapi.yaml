# SCOPE001: a GET that deletes, and a GET with a request body.
openapi: 3.1.0
info: { title: Leaky Reads API, version: "1" }
servers: [{ url: "https://api.example.com" }]
paths:
  /items/purge:
    get:
      operationId: deleteAllItems
      summary: Delete every item in the account
      responses: { "200": { description: ok } }
  /items/search:
    get:
      operationId: searchItems
      summary: Search items with a filter body
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses: { "200": { description: ok } }
