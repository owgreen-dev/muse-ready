# ERR001: 429 without Retry-After, and a secured operation with no 401/403.
openapi: 3.1.0
info: { title: Throttled API, version: "1" }
servers: [{ url: "https://api.example.com" }]
security: [{ key: [] }]
paths:
  /reports:
    get:
      operationId: listReports
      summary: List generated reports
      responses:
        "200": { description: ok }
        "429": { description: Slow down. }
components:
  securitySchemes:
    key: { type: apiKey, in: header, name: X-API-Key }
