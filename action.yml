name: muse-ready
description: Check whether an OpenAPI spec or MCP tool list is ready to become a Meta Muse connector.
author: owgreen-dev
branding:
  icon: check-circle
  color: blue
inputs:
  spec:
    description: Path or URL of an OpenAPI document (JSON/YAML) or an MCP tools/list result.
    required: true
  config:
    description: Path to a muse-ready config file. Defaults to muse-ready.config.{json,yaml,yml} in the workspace.
    required: false
  profile:
    description: Target platform - muse-custom (default; alias muse), muse-directory, claude, openai-apps, gemini or mcp.
    required: false
    default: muse-custom
  fail-under:
    description: Fail the step when the overall score is below this (0-100).
    required: false
  probe:
    description: Also make read-only GET requests to the declared server. Set MUSE_READY_TOKEN in env to probe secured endpoints.
    required: false
    default: "false"
  probe-mcp:
    description: With an MCP server, also POST JSON-RPC initialize and tools/list (nothing else) to check tool-list stability and stateless support. Implies probe.
    required: false
    default: "false"
  simulate:
    description: Run scenarios with a model playing the agent. Needs model, model-base-url and MUSE_READY_LLM_KEY in env. Your API is never called.
    required: false
    default: "false"
  tasks-file:
    description: Scenario file for simulate.
    required: false
    default: muse-ready.tasks.yaml
  model:
    description: Model ID for simulate, e.g. muse-spark-1.3.
    required: false
  model-base-url:
    description: OpenAI-compatible base URL for simulate.
    required: false
  sarif-file:
    description: Where to write the SARIF report, for github/codeql-action/upload-sarif.
    required: false
    default: muse-ready.sarif
  badge-file:
    description: Optional path for shields.io endpoint badge JSON.
    required: false
outputs:
  score:
    description: Overall readiness score, 0-100.
  grade:
    description: Letter grade, A+ to F.
  passed:
    description: '"true" when there are no blocking failures and the score meets fail-under.'
  sarif-file:
    description: Path of the SARIF report.
  scenario-pass-rate:
    description: Percentage of scenario runs that passed, when simulate is true.
runs:
  using: node24
  main: action/dist/index.mjs
